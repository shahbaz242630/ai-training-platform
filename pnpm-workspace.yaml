# pnpm settings. Since pnpm 11 this file, not .npmrc, is the canonical place.

# ---------------------------------------------------------------------------
# Install-script policy.
#
# A postinstall script runs arbitrary code on every machine that installs it,
# with that machine's permissions - which is how several npm compromises have
# actually executed. pnpm 11 requires an explicit true/false per package rather
# than a list, so each one is a recorded decision instead of an oversight.
#
# Both are false: the production build and the lint suite pass without either
# native binary, so there is no reason to let them execute code at install time.
# Flip one to true only if something genuinely breaks, and say why here.
allowBuilds:
  unrs-resolver: false
  sharp: false

# ---------------------------------------------------------------------------
# Supply-chain protection.
#
# minimumReleaseAge refuses any package version published less than N minutes
# ago. Recent npm compromises follow one shape: publish a malicious version,
# get it installed by CI within minutes, get it yanked hours later. Waiting a
# day defeats that entire window.
#
# 1440 (24h) is pnpm's default. It is set explicitly so the protection is a
# decision recorded in this repository rather than an inherited default that a
# future pnpm release could quietly change.
minimumReleaseAge: 1440

# Narrow, deliberate exceptions.
#
# Next.js 16.3.3 is a SECURITY release - it patched two critical advisories -
# published less than 24h before our first deploy, so the age check was
# blocking precisely the update we most wanted. This is the escape path pnpm
# documents for exactly that case.
#
# Why this is an acceptable risk rather than a hole:
#  - versions are pinned exactly and the lockfile carries integrity hashes, so
#    an existing version cannot be swapped underneath us;
#  - the residual risk is limited to the moment WE deliberately bump Next,
#    which is always a reviewed pull request, never automatic.
#
# Keep this list as short as possible. Every entry skips the waiting period, so
# adding one should feel like a decision rather than a convenience.
#
# Note what is NOT here: electron-to-chromium was also blocked, and instead of
# excluding it the lockfile was rebuilt so pnpm resolved an aged version. That
# is the preferred fix - exclude only what genuinely cannot be resolved older.
minimumReleaseAgeExclude:
  - next
  - "@next/*"
  # Ships as part of the same Next.js release; keeping it in lockstep with
  # `next` stops lint rules drifting from the framework version.
  - eslint-config-next
