# pnpm settings. Since pnpm 11 this file, not .npmrc, is the canonical place.

# ---------------------------------------------------------------------------
# Install-script policy.
#
# A postinstall script runs arbitrary code on every machine that installs it,
# with that machine's permissions - which is how several npm compromises have
# actually executed. pnpm 11 requires an explicit true/false per package rather
# than a list, so each one is a recorded decision instead of an oversight.
#
# Both are false: the production build and the lint suite pass without either
# native binary, so there is no reason to let them execute code at install time.
# Flip one to true only if something genuinely breaks, and say why here.
allowBuilds:
  unrs-resolver: false
  sharp: false

# ---------------------------------------------------------------------------
# Supply-chain protection.
#
# minimumReleaseAge refuses any package version published less than N minutes
# ago. Recent npm compromises follow one shape: publish a malicious version,
# get it installed by CI within minutes, get it yanked hours later. Waiting a
# day defeats that entire window.
#
# 1440 (24h) is pnpm's default. It is set explicitly so the protection is a
# decision recorded in this repository rather than an inherited default that a
# future pnpm release could quietly change.
minimumReleaseAge: 1440

# Exceptions: none standing (audit s104 SUP-8).
#
# Next.js 16.3.3 was a SECURITY release published less than 24h before our
# first deploy, so next, @next/* and eslint-config-next were excluded from the
# wait. That one-off stayed in place afterwards, so every later Next bump,
# Dependabot's included, installed versions that could be minutes old: the
# exact window the wait exists for. It is gone.
#
# When a security release genuinely cannot wait a day, add the package here as
#   minimumReleaseAgeExclude:
#     - next
# in that pull request only, say which advisory, and remove it in the next one.
# Prefer rebuilding the lockfile so an aged version resolves (as was done for
# electron-to-chromium); exclude only what genuinely cannot resolve older.

# ---------------------------------------------------------------------------
# Hoisting.
#
# pnpm's strict node_modules means a package can only resolve its own declared
# dependencies. @next/swc-wasm-nodejs is OUR devDependency, so the `next`
# package cannot see it - and Next therefore concludes it is missing and tries
# to DOWNLOAD it, even though the install log shows it present.
#
# That download is what actually breaks the build on this host: to find the
# registry Next runs `<package manager> config get registry` in a subshell,
# and the host does not put pnpm on PATH for child processes.
#
# Hoisting the package into the root node_modules makes it resolvable by
# `next`, so the WASM compiler loads from disk and no registry lookup ever
# happens. This keeps pnpm and every supply-chain protection configured above,
# where switching to npm would have discarded them.
publicHoistPattern:
  - "@next/swc-wasm-nodejs"

# ---------------------------------------------------------------------------
# Layout: a flat node_modules, no symlinks.
#
# pnpm's default ("isolated") layout reaches every transitive dependency through
# symlinks into node_modules/.pnpm. The host runs Next's standalone output and
# loads Next's own files from the non-real path node_modules/next/..., from
# which a symlinked sibling is unreachable. On the current deployment (#54,
# 2026-09-05) every page answered 500, observed 2026-09-12 in hPanel ->
# Runtime logs:
#
#   Error: Cannot find module '@swc/helpers/_/_interop_require_default'
#   Require stack: .../nodejs/node_modules/next/dist/client/lib/console.js ...
#
# The build completed every time; only the running server failed, so no build
# log showed it.
#
# "hoisted" is pnpm's documented flat layout: "a flat node_modules without
# symlinks is created. Same as the node_modules created by npm". Every package
# then sits at node_modules/<name>, reachable from any path. The supply-chain
# settings above (install scripts off, the release-age wait, its exclusions)
# are pnpm settings and stay in force; only the folder layout changes.
#
# The publicHoistPattern above is subsumed while this is set, and still correct
# if the layout ever goes back to isolated.
nodeLinker: hoisted

# ---------------------------------------------------------------------------
# Overrides.
#
# js-yaml below 4.3.2 (GHSA-2883-xcg3-v3hh, high: unbounded CPU on crafted
# merge keys) reaches us only through ESLint, which parses our own config on a
# developer machine, so no visitor input can reach it. Forced to the fixed
# version anyway (security scan, 2026-09-28). Remove once eslint pulls it.
#
# sharp below 0.35.5 (GHSA-wq5f-xc86-pv6w, high: a flaw in its bundled
# librsvg) and source-map-js below 1.2.2 (GHSA-68fv-2mgg-jv7q, high: event-loop
# denial of service through crafted source-map offsets) both arrive through
# `next` and failed the production dependency audit on 2026-10-07. Forced to
# the fixed versions, each published more than a week earlier, so the release-age
# wait above still holds. Remove each once `next` pulls the fixed version.
#
# brace-expansion below 1.1.21 and 4.x-5.x below 5.0.12 (six advisories, four
# high: denial of service through nested or comma-heavy brace patterns) reach
# us only through ESLint's minimatch, matching our own file globs on a
# developer machine or in CI. Invisible until the dependency graph could read
# this lockfile (audit s101 #20); forced to the fixed versions anyway, both
# published 2026-09-14. Remove each once eslint pulls the fixed version.
# (braces 3.0.3, the same kind of flaw through @next/eslint-plugin-next's
# fast-glob, has no fixed release yet; lint-only, so it waits for one.)
#
# vite below 8.2.4 (Dependabot alerts #8-#13: launch-editor command and %
# escaping, fs.allow and wasm-instance file reads, custom-middleware cross
# origin) reaches us only through vitest, i.e. the test runner and a dev
# server on a developer machine; the production build never runs vite.
# Forced to the fixed version anyway (s108). Remove once vitest pulls it.
overrides:
  "brace-expansion@<1.1.21": "1.1.21"
  "brace-expansion@>=4.0.0 <5.0.12": "5.0.12"
  "js-yaml@>=4.0.0 <4.3.2": "4.3.2"
  "sharp@<0.35.5": "0.35.5"
  "source-map-js@>=1.0.0 <1.2.2": "1.2.2"
  "vite@<8.2.4": "8.2.4"
