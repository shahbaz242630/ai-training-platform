name: Security

# Runtime versions are declared once and read from there by everyone:
#   Node -> .nvmrc                        (setup-node here, fnm on a laptop)
#   pnpm -> package.json#packageManager   (action-setup here, corepack on a laptop)
# Three deploys failed because CI ran a different pnpm than the host, and CI
# was structurally incapable of catching it. Never hardcode a version in a
# workflow step - it reintroduces exactly that split.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly sweep. A dependency that was clean on merge does not stay clean -
    # advisories are published against code that never changed.
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: a secret removed in a later commit is still exposed
          # in the one that introduced it, and still needs rotating.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Production dependencies are what actually reaches users, so high and
      # critical advisories there fail the build. Dev-only advisories are
      # reported but do not block - they cannot be exploited by a visitor.
      - name: Audit production dependencies (high and critical)
        run: pnpm audit --prod --audit-level high

      - name: Audit all dependencies (report only)
        run: pnpm audit --audit-level low || true

      # The audit above reads GitHub's reviewed advisory database, which lagged
      # Next.js's own advisories by days in September 2026 (GHSA-vcvr-r3jv-pc5j,
      # critical). Next.js is read directly from vercel/next.js. A failure to
      # read fails the step too: "could not look" is never "nothing found".
      - name: Next.js advisories (read from vercel/next.js)
        run: node scripts/next-advisories.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialise CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: javascript-typescript
          # security-extended adds lower-severity and experimental queries.
          queries: security-extended

      - name: Analyse
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:javascript-typescript"
