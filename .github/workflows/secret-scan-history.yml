name: Secret scan (full history)

# The Security workflow's gitleaks step is incremental: it scans only the
# commits in the triggering event. That catches a new leak where it enters, but
# it never re-checks what is already in history, and a rule added later never
# looks back (audit s104 SUP-9). This scans every commit, weekly and on every
# push, as the zaaheen repository's own history scan does. On a public
# repository a secret is scraped within seconds of being pushed, and rewriting
# history does not un-leak it.
#
# Known findings that are not secrets live in .gitleaksignore, one fingerprint
# each, with the reason.

on:
  # Every branch: checkout with fetch-depth 0 fetches them all and gitleaks
  # scans them all, so whoever pushes a finding sees it on their own push.
  push:
    branches: ["**"]
  schedule:
    - cron: "53 5 * * 1"
  workflow_dispatch:

concurrency:
  group: secret-scan-history-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-history:
    name: Scan every commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Every commit, not just the tip.
          fetch-depth: 0
          persist-credentials: false

      # The gitleaks binary rather than the action, which limits itself to the
      # event's commits. Pinned by digest, not tag (a tag can be re-pushed and
      # silence the scan): v8.24.3, read from Docker Hub and the registry on
      # 2026-10-20 and matching.
      - name: Scan full history
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 \
            detect \
              --config .gitleaks.toml \
              --source . \
              --redact \
              --verbose \
              --report-format sarif \
              --report-path gitleaks-history.sarif

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gitleaks-history-sarif
          path: gitleaks-history.sarif
          retention-days: 30
          if-no-files-found: ignore
