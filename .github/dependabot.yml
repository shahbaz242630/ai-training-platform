# Update pull requests, weekly (security audit, 2026-09-27: only security
# updates ran, so nothing kept the packages and the pinned actions current
# between advisories). Every pull request still passes the full CI and the
# required checks before it can merge.
version: 2
updates:
  - package-ecosystem: npm # reads pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Seven days after a release (GitHub's guidance; a security scan flagged
    # the shorter wait): outside the window in which a compromised version is
    # typically published and pulled. pnpm's own one-day wait is well inside it.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The runtime is Node 24 (.nvmrc). Types for a newer major let code call
      # APIs that do not exist on 24, so @types/node moves with the runtime,
      # by hand, never ahead of it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      # init and analyze must move together, or CodeQL fails (#72, #74).
      codeql:
        patterns: ["github/codeql-action/*"]
